<style>
/* ============================================================
   PulseIQ — shared design tokens (v2 — dark neon "futuristic AI")
   Near-black glass UI. Primary accent: neon cyan/teal.
   Secondary accent: purple/magenta, reserved for AI/explainability.
   Every page shares this file so the look never drifts.
   ============================================================ */
:root{
  /* base surfaces */
  --void:#04060a;
  --bg-deep:#070b12;
  --bg-panel:#0a0f18;
  --bg-panel-2:#0d1420;

  /* glass */
  --glass:rgba(255,255,255,0.035);
  --glass-hover:rgba(255,255,255,0.065);
  --glass-strong:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.09);
  --glass-border-2:rgba(255,255,255,0.16);

  /* primary neon — cyan/teal */
  --cyan:#22e5f0;
  --cyan-bright:#7bf5fb;
  --cyan-dim:#0e6e78;
  --cyan-ink:#031a1c;
  --cyan-glow:rgba(34,229,240,0.45);
  --cyan-glow-soft:rgba(34,229,240,0.18);

  /* secondary neon — purple/magenta (AI + explainability only) */
  --purple:#b45cf7;
  --purple-bright:#dd9bff;
  --purple-dim:#5b2a82;
  --purple-ink:#1c0a2b;
  --purple-glow:rgba(180,92,247,0.45);
  --purple-glow-soft:rgba(180,92,247,0.18);

  /* text */
  --ink-0:#f3f6fa;
  --ink-200:#c7d0dc;
  --ink-400:#8b96a8;
  --ink-600:#5b6576;
  --ink-800:#2c3340;

  /* semantic vitals / data (bright, legible on black) */
  --hr:#3ce685;
  --spo2:#35c7ff;
  --sbp:#ff6b6b; --sbp-glow:rgba(255,107,107,0.4);
  --dbp:#8aa8ff;
  --map-c:#5fe3a6;
  --rr:#ffd166;
  --clinic:#22e5f0; --clinic-stroke:#0e6e78;
  --doctor:#7c93ff; --doctor-stroke:#3d4fb8;
  --hospital:#ff6b6b; --hospital-stroke:#a83a3a;

  --amber:#ffc857;
  --red:#ff5c72;
  --green:#3ce685;

  --radius-lg:22px; --radius-md:15px; --radius-sm:10px;
  font-family:'Inter',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:
    radial-gradient(circle at 12% 8%, var(--cyan-glow-soft) 0%, transparent 32%),
    radial-gradient(circle at 88% 92%, var(--purple-glow-soft) 0%, transparent 34%),
    var(--void);
  color:var(--ink-0);
}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--cyan-glow);color:#fff;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:99px;}

.mono{font-family:'JetBrains Mono',monospace;}
.grad-cyan{background:linear-gradient(90deg,var(--cyan),var(--cyan-bright));-webkit-background-clip:text;background-clip:text;color:transparent;}
.grad-purple{background:linear-gradient(90deg,var(--purple),var(--purple-bright));-webkit-background-clip:text;background-clip:text;color:transparent;}

/* ---------------- App shell (icon rail + top bar) ---------------- */
.app{display:flex;height:100vh;background:transparent;position:relative;overflow:hidden;}
.app::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size:44px 44px;
}
#rail{width:236px;background:rgba(8,12,18,0.75);backdrop-filter:blur(18px);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;padding:20px 14px;flex-shrink:0;position:relative;z-index:2;}
#rail .r-logo{display:flex;align-items:center;gap:11px;padding:0 6px;margin-bottom:22px;}

.pulse-mark{background-image:var(--pulse-logo);background-size:cover;background-position:center;
  background-repeat:no-repeat;}
#rail .mark{width:36px;height:36px;border-radius:11px;flex-shrink:0;
  background-image:var(--pulse-logo);background-size:cover;background-position:center;
  box-shadow:0 0 18px -4px var(--cyan-glow);}
#rail .r-logo h2{font-size:14.5px;font-weight:800;color:#fff;margin:0;letter-spacing:-0.01em;}
#rail .r-logo h2 span{color:var(--cyan-bright);}
#rail .r-logo .r-home{font-size:9.5px;color:var(--ink-600);font-weight:700;letter-spacing:0.05em;
  text-transform:uppercase;margin-top:2px;}
#rail .r-logo:hover .r-home{color:var(--cyan-bright);}
#rail .r-section{font-size:9.5px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-600);padding:14px 10px 8px;}
#rail .icon{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;font-size:13px;font-weight:600;color:var(--ink-400);margin-bottom:3px;text-decoration:none;transition:all .15s;}
#rail .icon .ic{font-size:16px;width:18px;text-align:center;flex-shrink:0;}
#rail .icon:hover{background:var(--glass-hover);color:var(--ink-0);}
#rail .icon.on{background:rgba(34,229,240,0.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(34,229,240,0.3);position:relative;}

#rail .spacer{flex:1;}

#rail .ap-n{font-size:12.5px;font-weight:800;color:#fff;line-height:1.25;}

#rail .ap-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;
  border-bottom:1px solid rgba(255,255,255,0.05);font-size:10px;}
#rail .ap-r:last-child{border-bottom:none;}
#rail .ap-r .k{color:var(--ink-600);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;}
#rail .ap-r .v{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--cyan-bright);

#rail .ap-r .v.none{color:var(--ink-500);}
#rail .ap-go{padding:10px 13px;font-size:10.5px;font-weight:700;color:var(--ink-500);

#rail .acct-pop:hover .ap-go{color:var(--cyan-bright);}
#rail .avatar{width:34px;height:34px;border-radius:10px;background:var(--glass-strong);border:1px solid var(--glass-border-2);color:var(--ink-200);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#rail .r-user .nm{font-size:12px;font-weight:700;color:#fff;}
#rail .r-user .rl{font-size:9.5px;color:var(--ink-500);text-transform:capitalize;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;z-index:1;}
.topbar{height:60px;background:rgba(8,12,18,0.65);backdrop-filter:blur(18px);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0;border-bottom:1px solid var(--glass-border);}
.brand{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:14.5px;letter-spacing:-0.01em;}
.brand span{color:var(--cyan-bright);}
.stat-chip{background:var(--glass);border:1px solid var(--glass-border);border-radius:11px;padding:7px 13px;font-size:11.5px;color:var(--ink-200);font-weight:700;display:flex;align-items:center;gap:7px;}
.stat-chip small{color:var(--ink-400);font-weight:500;font-size:10px;}
.topbar .grow{flex:1;}
.clock{color:var(--ink-400);font-family:'JetBrains Mono',monospace;font-size:12px;margin-right:6px;}
.topbar-btn{background:linear-gradient(90deg,var(--cyan),var(--cyan-bright));color:var(--cyan-ink);border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:12px;box-shadow:0 8px 20px -8px var(--cyan-glow);}
.topbar-btn.ghost{background:var(--glass);border:1px solid var(--glass-border);color:#fff;box-shadow:none;}

.content{flex:1;overflow-y:auto;padding:28px 32px;position:relative;z-index:1;}
.content.no-pad{padding:0;}

.status-bar{height:32px;background:rgba(5,7,11,0.85);backdrop-filter:blur(12px);border-top:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:10.5px;color:var(--ink-400);font-family:'JetBrains Mono',monospace;flex-shrink:0;position:relative;z-index:2;}
.status-bar b{color:var(--ink-200);}
.status-bar a{color:var(--cyan-bright);}

/* ---------------- Generic glass components ---------------- */
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:22px 24px;backdrop-filter:blur(14px);}
.card h3{margin:0 0 4px;font-size:15px;font-weight:700;color:#fff;}
.card .card-sub{font-size:12.5px;color:var(--ink-400);margin-bottom:16px;}
.card.glow-cyan{box-shadow:0 0 0 1px rgba(34,229,240,0.14), 0 30px 60px -30px var(--cyan-glow);}
.card.glow-purple{box-shadow:0 0 0 1px rgba(180,92,247,0.16), 0 30px 60px -30px var(--purple-glow);}

.badge{font-size:10.5px;font-weight:800;padding:6px 12px;border-radius:999px;letter-spacing:0.04em;display:inline-block;border:1px solid transparent;}
.badge.pass{background:rgba(60,230,133,0.1);color:var(--green);border-color:rgba(60,230,133,0.35);box-shadow:0 0 14px -6px rgba(60,230,133,0.5);}
.badge.fail{background:rgba(255,92,114,0.1);color:var(--red);border-color:rgba(255,92,114,0.35);box-shadow:0 0 14px -6px rgba(255,92,114,0.5);}
.badge.grade-a{background:rgba(60,230,133,0.1);color:var(--green);border-color:rgba(60,230,133,0.35);box-shadow:0 0 14px -6px rgba(60,230,133,0.5);}
.badge.grade-b{background:rgba(255,200,87,0.1);color:var(--amber);border-color:rgba(255,200,87,0.35);}
.badge.grade-d{background:rgba(255,92,114,0.1);color:var(--red);border-color:rgba(255,92,114,0.35);}
.badge.cyan{background:rgba(34,229,240,0.1);color:var(--cyan-bright);border-color:rgba(34,229,240,0.35);}
.badge.purple{background:rgba(180,92,247,0.1);color:var(--purple-bright);border-color:rgba(180,92,247,0.4);}

.btn{font-weight:700;font-size:13px;padding:11px 20px;border-radius:12px;border:none;transition:transform .1s;}
.btn:active{transform:scale(0.97);}
.btn.primary{background:linear-gradient(90deg,var(--cyan),var(--cyan-bright));color:var(--cyan-ink);box-shadow:0 10px 26px -10px var(--cyan-glow);}
.btn.accent{background:linear-gradient(90deg,var(--purple),var(--purple-bright));color:#160821;box-shadow:0 10px 26px -10px var(--purple-glow);}
.btn.outline{background:transparent;border:1.5px solid var(--glass-border-2);color:#fff;}
.btn.subtle{background:var(--glass);border:1px solid var(--glass-border);color:var(--ink-200);}

.page-head{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;}
.page-head h1{font-size:21px;font-weight:800;margin:0;color:#fff;letter-spacing:-0.01em;}
.page-head .sub{color:var(--ink-400);font-size:13px;}

/* ---------------- Mono data table (model comparison etc.) ---------------- */
.mono-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:12px;}
.mono-table th{text-align:left;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-400);font-weight:700;padding:0 12px 10px;border-bottom:1px solid var(--glass-border);}
.mono-table td{padding:12px;border-bottom:1px solid var(--glass-border);color:var(--ink-200);}
.mono-table tr:last-child td{border-bottom:none;}
.mono-table td.hl{color:#fff;font-weight:700;}

/* ---------------- Circular gauge ---------------- */
.gauge{position:relative;width:120px;height:120px;flex-shrink:0;}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg);}
.gauge .track{fill:none;stroke:var(--glass-border);stroke-width:9;}
.gauge .fill{fill:none;stroke-width:9;stroke-linecap:round;filter:drop-shadow(0 0 8px currentColor);}
.gauge .fill.cyan{stroke:var(--cyan);color:var(--cyan);}
.gauge .fill.purple{stroke:var(--purple);color:var(--purple);}
.gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.gauge .center .v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:22px;color:#fff;}
.gauge .center .l{font-size:9px;color:var(--ink-400);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;}

/* ---------------- Neon divider / kicker ---------------- */
.kicker{font-size:10.5px;font-weight:800;letter-spacing:0.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:10px;}

/* ---------------- Stat tiles (dashboard KPI row) ---------------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
.stat-tile{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:16px 18px;}
.stat-tile .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.stat-tile .lbl{font-size:10px;font-weight:700;color:var(--ink-400);text-transform:uppercase;letter-spacing:0.04em;}
.stat-tile .ic{font-size:16px;opacity:0.85;}
.stat-tile .v{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:24px;color:#fff;}
.stat-tile .v small{font-size:12px;color:var(--ink-400);font-weight:600;}
.stat-tile .tag{display:inline-block;margin-top:8px;font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:99px;}
.stat-tile .tag.ok{background:rgba(60,230,133,0.12);color:var(--green);}
.stat-tile .tag.warn{background:rgba(255,200,87,0.12);color:var(--amber);}
.stat-tile .tag.bad{background:rgba(255,92,114,0.14);color:#ff8095;}

/* ---------------- Tabs ---------------- */
.tabs{display:flex;gap:4px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:4px;width:fit-content;margin-bottom:18px;}
.tabs .tab{padding:9px 18px;border-radius:9px;font-size:12px;font-weight:700;color:var(--ink-400);cursor:pointer;}
.tabs .tab.on{background:linear-gradient(90deg,var(--cyan),var(--cyan-bright));color:var(--cyan-ink);}
.tabs .tab.on.purple{background:linear-gradient(90deg,var(--purple),var(--purple-bright));color:#160821;}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--glass-border);margin-bottom:18px;}
.subtabs .stab{padding:0 0 12px;font-size:12.5px;font-weight:700;color:var(--ink-500);cursor:pointer;border-bottom:2px solid transparent;}
.subtabs .stab.on{color:#fff;border-color:var(--cyan);}

/* ---------------- Progress bar ---------------- */
.pbar{height:7px;border-radius:99px;background:rgba(255,255,255,0.06);overflow:hidden;}
.pbar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));}

/* ---------------- Quick action tiles ---------------- */
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media (max-width:1180px){.qa-grid{grid-template-columns:repeat(3,1fr);}}
@media (max-width:820px){.qa-grid{grid-template-columns:repeat(2,1fr);}}
.qa-tile{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-lg);
  padding:26px 20px;text-align:center;transition:transform .16s,background .16s,border-color .16s,box-shadow .16s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;}
.qa-tile:hover{background:var(--glass-hover);transform:translateY(-3px);
  border-color:rgba(34,229,240,0.38);box-shadow:0 18px 40px -22px rgba(34,229,240,0.65);}
.qa-tile .ic{width:56px;height:56px;border-radius:16px;
  background:linear-gradient(135deg,rgba(34,229,240,0.20),rgba(34,229,240,0.06));
  border:1px solid rgba(34,229,240,0.20);display:flex;align-items:center;justify-content:center;
  font-size:26px;margin:0 auto 14px;transition:transform .16s;}
.qa-tile:hover .ic{transform:scale(1.07);}
.qa-tile .t{font-size:15px;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:-0.01em;}
.qa-tile .d{font-size:11.5px;color:var(--ink-500);line-height:1.45;}

/* ---------------- Chat history list ---------------- */
.chx-item{padding:11px 12px;border-radius:11px;margin-bottom:4px;cursor:pointer;}
.chx-item:hover, .chx-item.on{background:var(--glass-hover);}
.chx-item .t{font-size:12px;font-weight:700;color:var(--ink-200);}
.chx-item .d{font-size:10px;color:var(--ink-600);margin-top:2px;}

/* ---------------- Document grid cards ---------------- */
.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.doc-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:16px 17px;}
.doc-card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.doc-card .ic{width:36px;height:36px;border-radius:10px;background:rgba(34,229,240,0.1);display:flex;align-items:center;justify-content:center;font-size:15px;}
.doc-card .nm{font-size:12.5px;font-weight:700;color:#fff;}
.doc-card .meta{font-size:10.5px;color:var(--ink-500);display:flex;justify-content:space-between;}

/* ---------------- Calendar strip ---------------- */
.cal-strip{display:flex;gap:8px;margin-bottom:18px;}
.cal-day{flex:1;text-align:center;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;padding:10px 4px;}
.cal-day .dow{font-size:9.5px;color:var(--ink-500);text-transform:uppercase;font-weight:700;}
.cal-day .num{font-size:15px;font-weight:800;color:#fff;margin-top:4px;}
.cal-day.on{background:linear-gradient(160deg,rgba(34,229,240,0.16),rgba(34,229,240,0.05));border-color:rgba(34,229,240,0.4);}
.cal-day.on .num{color:var(--cyan-bright);}

/* ============================================================
   Phone layout
   ------------------------------------------------------------
   The 236px sidebar consumes most of a 390px screen, which left
   the content clipped and unreachable. Below 900px the rail
   becomes an off-canvas drawer opened from a button in the
   topbar, and the main column takes the full width.
   ============================================================ */
.rail-burger{display:none;}
.rail-scrim{display:none;}

@media (max-width:900px){
  .app{overflow:visible;}

  #rail{position:fixed;top:0;left:0;bottom:0;width:78vw;max-width:300px;z-index:600;
    transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:0 0 60px rgba(0,0,0,0.6);overflow-y:auto;}
  #rail.open{transform:translateX(0);}
  /* The drawer sits above the page, so the account popover opens downward
     instead of off the top edge. */
  #rail .acct-pop{bottom:auto;top:calc(100% + 8px);}

  .rail-scrim{display:block;position:fixed;inset:0;z-index:500;background:rgba(2,4,8,0.6);
    opacity:0;pointer-events:none;transition:opacity .22s ease;}
  .rail-scrim.on{opacity:1;pointer-events:auto;}

  .rail-burger{display:flex;align-items:center;justify-content:center;flex-shrink:0;
    width:38px;height:38px;border-radius:11px;background:var(--glass);
    border:1px solid var(--glass-border-2);color:var(--ink-100);
    font-size:17px;line-height:1;cursor:pointer;padding:0;}
  .rail-burger:active{background:var(--glass-hover);}

  .main{width:100%;}
  .topbar{height:auto;min-height:56px;padding:10px 14px;gap:10px;flex-wrap:wrap;}
  .topbar .clock{display:none;}            /* the phone already shows the time */
  .content{padding:16px 14px 28px;}
  .card{padding:16px 15px;}
  .page-head{flex-direction:column;align-items:flex-start;gap:4px;margin-bottom:16px;}
  .page-head h1{font-size:19px;}
  .page-head .sub{font-size:12px;}

  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-tile{padding:13px 14px;}
  .stat-tile .v{font-size:20px;}

  .qa-grid{grid-template-columns:repeat(2,1fr);gap:11px;}
  .qa-tile{padding:18px 10px;min-height:124px;}

  /* Tab strips scroll sideways rather than forcing the page to. */
  .tabs{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tabs::-webkit-scrollbar{display:none;}
  .tabs .tab{white-space:nowrap;padding:9px 14px;}
  .subtabs{overflow-x:auto;gap:14px;}
  .subtabs .stab{white-space:nowrap;}

  /* Only the left half of the status bar carries information worth the space. */
  .status-bar{font-size:9.5px;padding:0 12px;}
  .status-bar > span:last-child{display:none;}

  /* Wide tables scroll inside their card instead of stretching the page. */
  .mono-table{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}

@media (max-width:420px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .qa-tile{min-height:112px;padding:15px 8px;}
}

(function () {

      { key: 'chat',      href: 'chat.html',               icon: '\ud83d\udcac', label: 'Messages',       sub: 'Doctors & AI assistant' }
    ],
    doctor: [
      { key: 'monitor',  href: 'icu-monitor.html', icon: '\ud83e\udec0', label: 'ICU Monitor',      sub: 'Patient waveforms' },
      { key: 'insights', href: 'xai-results.html', icon: '\ud83e\udde0', label: 'Explainability',   sub: 'Why this reading' },
      { key: 'chat',     href: 'chat.html',        icon: '\ud83d\udcac', label: 'Patient Messages', sub: 'Your patients' }

  var FOOT = [
    { key: 'settings', href: 'settings.html', icon: '\u2699\ufe0f', label: 'Settings' }
  ];

  function homeHref() { return HOME[role] || HOME.patient; }

  function wireAccountMenu() {
    var btn = document.getElementById('pulseAcct');
    var pop = document.getElementById('pulseAcctPop');
    if (!btn || !pop) return;
    var open = false;
    btn.addEventListener('click', function (e) {
      e.stopPropagation();
      open = !open;
      pop.classList.toggle('on', open);
      btn.classList.toggle('on', open);
    });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () {
      open = false; pop.classList.remove('on'); btn.classList.remove('on');
    });
    function row(k, v, cls) {
      return '<div class="ap-r"><span class="k">' + k + '</span>' +
             '<span class="v' + (cls ? ' ' + cls : '') + '">' + v + '</span></div>';
    }
    var grid = document.getElementById('pulseAcctGrid');
    // A linked recording is a patient-only concept -- a clinician's account is
    // never tied to one, so the row is omitted for doctors rather than shown
    // permanently reading "not linked".
    function recordingRow(subj) {
      if (role === 'doctor') return '';
      return row('Recording', subj ? subj : 'not linked', subj ? '' : 'none');
    }
    // Real account details only -- nothing here is filled in from a guess.
    var token = localStorage.getItem('pulseiq_token');
    if (!token) {
      grid.innerHTML = row('Role', role) +
        (role === 'doctor' ? '' : row('Recording', 'demo data', 'none'));
      return;
    }
    var api = window.PULSEIQ_API_BASE || 'http://localhost:8001';
    fetch(api + '/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) { grid.innerHTML = row('Account', 'session expired', 'none'); return; }
        document.getElementById('pulseAcctEmail').textContent = d.user.email || '';
        grid.innerHTML = row('Role', d.user.role) + recordingRow(d.user.subject_id);
      })
      .catch(function () {
        document.getElementById('pulseAcctEmail').textContent = 'backend offline';
        grid.innerHTML = row('Role', role) +
          (role === 'doctor' ? '' : row('Recording', 'unavailable', 'none'));
      });
  }

  function renderRail() {
    var el = document.getElementById('rail');
    if (!el) return;
    var active = el.getAttribute('data-active') || 'home';
    // The logo is the way home now that page links live on the dashboard.
    var html = '<a href="' + homeHref() + '" class="r-logo" style="text-decoration:none;" title="Back to dashboard">'
      + '<div class="mark"></div><div><h2>Pulse<span>IQ</span></h2>'
      + '<div class="r-home">\u2039 Dashboard</div></div></a>';
    html += '<div class="spacer"></div>';
    FOOT.forEach(function (it) {
      html += '<a class="icon' + (it.key === active ? ' on' : '') + '" href="' + it.href + '"><span class="ic">' + it.icon + '</span>' + it.label + '</a>';
    });
    html += '<div class="r-foot">';
    html += '<a class="icon" href="login.html" id="pulseLogoutLink"><span class="ic">\u21aa</span>Logout</a>';
    html += '<div class="r-acct">';
    html += '<div class="r-user" id="pulseAcct" title="Account"><div class="avatar">' + initials + '</div>'
         +  '<div><div class="nm">' + name + '</div><div class="rl">' + roleLabel + '</div></div>'
         +  '<span class="chev">\u203a</span></div>';
    // The card itself is the profile summary -- no menu rows. Clicking it opens
    // the full profile page; Logout already has its own row above.
    html += '<a class="acct-pop" id="pulseAcctPop" href="' + (isRealAccount ? 'profile.html' : 'login.html') + '">'
         +  '<div class="ap-head"><div class="ap-av">' + initials + '</div>'
         +  '<div><div class="ap-n">' + name + '</div>'
         +  '<div class="ap-e" id="pulseAcctEmail">' + (isRealAccount ? 'Loading\u2026' : 'Not signed in') + '</div>'
         +  '</div></div>'
         +  '<div class="ap-grid" id="pulseAcctGrid"></div>'
         +  '<div class="ap-go">' + (isRealAccount ? 'Open full profile \u2192' : 'Sign in \u2192') + '</div>'
         +  '</a>';
    html += '</div>';
    html += '</div>';
    el.innerHTML = html;
    wireAccountMenu();
    wireMobileDrawer(el);
    var logoutLink = document.getElementById('pulseLogoutLink');
    if (logoutLink) {
      logoutLink.addEventListener('click', function () {
        localStorage.removeItem('pulseiq_role');
        localStorage.removeItem('pulseiq_name');
        localStorage.removeItem('pulseiq_token');
      });
    }
  }

  // On a phone the rail is an off-canvas drawer. The button lives in the page's
  // own topbar, so it is injected here rather than duplicated in 13 files.
  function wireMobileDrawer(rail) {
    var bar = document.querySelector('.topbar');
    if (!bar) return;

    var scrim = document.querySelector('.rail-scrim');
    if (!scrim) {
      scrim = document.createElement('div');
      scrim.className = 'rail-scrim';
      document.body.appendChild(scrim);
    }

    var burger = document.getElementById('railBurger');
    if (!burger) {
      burger = document.createElement('button');
      burger.id = 'railBurger';
      burger.className = 'rail-burger';
      burger.setAttribute('aria-label', 'Open menu');
      burger.setAttribute('aria-expanded', 'false');
      burger.innerHTML = '\u2630';
      bar.insertBefore(burger, bar.firstChild);
    }

    function setOpen(open) {
      rail.classList.toggle('open', open);
      scrim.classList.toggle('on', open);
      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      // Stop the page behind the drawer from scrolling under a thumb.
      document.body.style.overflow = open ? 'hidden' : '';
    }

    burger.addEventListener('click', function (e) {
      e.stopPropagation();
      setOpen(!rail.classList.contains('open'));
    });
    scrim.addEventListener('click', function () { setOpen(false); });
    // Following a link inside the drawer should not leave it open behind the
    // next page's paint.
    rail.addEventListener('click', function (e) {
      if (e.target.closest('a')) setOpen(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') setOpen(false);
    });
    // Rotating to landscape can cross the breakpoint; drop the drawer state so
    // the desktop layout never starts with body scroll locked.
    window.addEventListener('resize', function () {
      if (window.innerWidth > 900) setOpen(false);
    });
  }

  // Dashboard tile grid — the single source of truth for where a user can go,
  // so the patient and doctor dashboards can never drift out of sync.
  function renderHub(elId) {
    var el = document.getElementById(elId || 'qaHub');
    if (!el) return;
    var items = HUB[role] || HUB.patient;
    // 7 tiles over a 4-wide grid leaves a hole in the last row; widening the
    // final tile to fill it keeps the block rectangular at any count.
    var cols = window.innerWidth <= 820 ? 2 : (window.innerWidth <= 1180 ? 3 : 4);
    var rem = items.length % cols;
    var lastSpan = rem === 0 ? 1 : (cols - rem + 1);
    el.innerHTML = items.map(function (it, i) {
      var span = (i === items.length - 1 && lastSpan > 1) ? 'grid-column:span ' + lastSpan + ';' : '';
      return '<a class="qa-tile" href="' + it.href + '" style="text-decoration:none;position:relative;' + span + '"' +
             (it.key === 'chat' ? ' data-unread-slot="1"' : '') + '>' +
             '<div class="ic">' + it.icon + '</div>' +
             '<div class="t">' + it.label + '</div>' +
             '<div class="d">' + it.sub + '</div></a>';
    }).join('');
  }

  function currentRole() { return role; }
  function currentName() { return name; }

  // ---- Unread-message badge on the Messages nav item -------------------
  // Rendered on every page so a new message is visible from anywhere, not
  // only when the chat page happens to be open.
  function setNavUnread(count) {
    var links = document.querySelectorAll('[data-unread-slot], #rail a[href="chat.html"]');
    Array.prototype.forEach.call(links, function (link) {
      var badge = link.querySelector('.nav-unread');
      if (!count || count < 1) { if (badge) badge.remove(); return; }
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'nav-unread';
        badge.style.cssText = 'position:absolute;top:8px;right:8px;min-width:18px;height:18px;padding:0 6px;' +
          'border-radius:99px;background:linear-gradient(90deg,#22e5f0,#7bf5fb);color:#04070b;font-size:10px;' +
          'font-weight:800;display:flex;align-items:center;justify-content:center;' +
          'box-shadow:0 0 12px -2px rgba(34,229,240,0.7);';
        link.appendChild(badge);
      }
      badge.textContent = count > 99 ? '99+' : count;
    });
  }

  function pollUnread() {
    var token = localStorage.getItem('pulseiq_token');
    if (!token) return;                       // guests have no real inbox
    var api = window.PULSEIQ_API_BASE || 'http://localhost:8001';
    fetch(api + '/api/unread', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d) setNavUnread(d.totalUnread); })
      .catch(function () { /* backend down — just leave the badge as-is */ });
  }

  // ---- Which recording belongs to the signed-in patient ----------------
  // Guests fall back to the demo subject; a real account uses only the
  // recording it has been linked to, and gets null when it has none — so no
  // page ever shows someone else's data under the wrong name.
  var DEMO_SUBJECT = 'rohit-sharma';

  function resolvePatientKey() {
    var api = window.PULSEIQ_API_BASE || 'http://localhost:8001';
    var token = localStorage.getItem('pulseiq_token');
    if (!token) {
      return Promise.resolve({ key: DEMO_SUBJECT, linked: true, guest: true, name: null });
    }
    return fetch(api + '/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return { key: DEMO_SUBJECT, linked: true, guest: true, name: null };
        var subj = d.user.subject_id;
        return {
          key: subj || null,
          linked: !!subj,
          guest: false,
          name: d.user.name,
          userId: d.user.id
        };
      })
      .catch(function () {
        return { key: DEMO_SUBJECT, linked: true, guest: true, name: null };
      });
  }

  // Standard "your account has no recording yet" panel.
  function noDataHtml(name) {
    return '<div class="card" style="text-align:center;padding:42px 28px;">' +
      '<div style="font-size:34px;margin-bottom:10px;">📉</div>' +
      '<h3 style="margin:0 0 8px;">No recording linked to ' + (name ? name : 'this account') + '</h3>' +
      '<div style="font-size:12.5px;color:var(--ink-400);line-height:1.7;max-width:460px;margin:0 auto 18px;">' +
      'This account has no PPG recording yet, so there are no readings to show. ' +
      'Enter the Patient ID of a recording to link it to your account.</div>' +
      '<a href="profile.html" style="display:inline-block;background:linear-gradient(90deg,#22e5f0,#7bf5fb);' +
      'color:#04070b;padding:11px 22px;border-radius:11px;font-weight:800;font-size:12.5px;text-decoration:none;">' +
      'Link a Patient ID →</a></div>';
  }

  window.PulseShell = {
    renderRail: renderRail, renderHub: renderHub, homeHref: homeHref,
    role: currentRole, name: currentName,
    setNavUnread: setNavUnread, pollUnread: pollUnread,
    resolvePatientKey: resolvePatientKey, noDataHtml: noDataHtml,
    DEMO_SUBJECT: DEMO_SUBJECT
  };
  document.addEventListener('DOMContentLoaded', function () {
    renderRail();
    renderHub('qaHub');
    var rT;
    window.addEventListener('resize', function () {
      clearTimeout(rT);
      rT = setTimeout(function () { renderHub('qaHub'); pollUnread(); }, 180);
    });
    pollUnread();
    setInterval(pollUnread, 10000);
  });
})();

</script>
<script>
  document.querySelectorAll('.sw').forEach(function(sw){ sw.addEventListener('click', function(){ this.classList.toggle('on'); }); });
  function tick(){ var d=new Date(); document.getElementById('clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':'); }
  setInterval(tick,1000); tick();
</script>
